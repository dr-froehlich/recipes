name: Build Docker Container

on: push

jobs:
  build-container:
    name: Build ${{ matrix.name }} Container
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Standard build config
          - name: Standard
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Get version number
        id: get_version
        run: |
          if [[ "$GITHUB_REF" = refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" = refs/heads/beta ]]; then
            echo VERSION=beta >> $GITHUB_OUTPUT
          else
            echo VERSION=develop >> $GITHUB_OUTPUT
          fi

      # Build Vue 3 frontend
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: vue3/yarn.lock
      - name: Install dependencies
        working-directory: ./vue3
        run: yarn install --frozen-lockfile
      - name: Build dependencies
        working-directory: ./vue3
        run: yarn build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      # Docker Hub is upstream's registry only. `github.secret_source` is 'Actions' on a fork
      # too — the fork simply has no DOCKER_* secrets — so without the owner check this step
      # would attempt a login with an empty username and fail the job before any build.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: github.secret_source == 'Actions' && github.repository_owner == 'TandoorRecipes'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: github.secret_source == 'Actions'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Docker Hub only on upstream; ghcr follows whichever repository is building, so a
          # fork publishes to its own package namespace without hardcoding a fork name here.
          images: |
            ${{ github.repository_owner == 'TandoorRecipes' && 'vabene1111/recipes' || '' }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=long
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: ${{ github.secret_source == 'Actions' }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-stable:
    name: Notify Stable
    runs-on: ubuntu-latest
    needs: build-container
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'TandoorRecipes'
    steps:
      - name: Set tag name
        run: |
          # Strip "refs/tags/" prefix
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      # Send stable discord notification
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: '🚀 Version {{ VERSION }} of tandoor has been released 🥳 Check it out https://github.com/vabene1111/recipes/releases/tag/{{ VERSION }}'

  notify-beta:
    name: Notify Beta
    runs-on: ubuntu-latest
    needs: build-container
    if: github.ref == 'refs/heads/beta' && github.repository_owner == 'TandoorRecipes'
    steps:
      # Send beta discord notification
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: '🚀 The Tandoor 2 Image has been updated! 🥳'
